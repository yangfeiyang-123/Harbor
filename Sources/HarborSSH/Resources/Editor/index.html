<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; base-uri 'none'; form-action 'none'"><style>
:root{color-scheme:light;--bg:#FFFFFF;--fg:#202020;--muted:#606060;--border:#F0F1F2;--font:13px}:root[data-theme=dark]{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-width:0;min-height:0;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,sans-serif}#editor{width:100%;height:100%;min-width:0;min-height:0;overflow:hidden}[hidden]{display:none!important}#preview{width:100%;height:100%;overflow:auto;padding:24px max(24px,calc((100% - 880px)/2));font-size:var(--font);line-height:1.75;overflow-wrap:anywhere}#preview h1,#preview h2{border-bottom:1px solid var(--border);padding-bottom:.3em}#preview pre{overflow:auto;background:var(--code);padding:16px;border-radius:8px}#preview code{font-family:ui-monospace,Menlo,monospace;font-size:.92em}#preview :not(pre)>code{background:var(--inline);color:var(--inlineText);padding:2px 4px;border-radius:3px}#preview blockquote{border-left:3px solid var(--quoteBorder);background:var(--quote);margin-left:0;padding:8px 16px;color:var(--fg)}#preview table{border-collapse:collapse}#preview th,#preview td{padding:6px 12px;border:1px solid var(--border)}#preview img{max-width:100%}a{color:var(--link)}a:hover{color:var(--linkActive)}::selection{background:var(--selection)}*{scrollbar-color:var(--scrollbar) transparent}
</style></head><body><div id="editor"></div><article id="preview" hidden></article><script src="editor.js"></script></body></html>
